[workspace]
resolver = "2"
members = [
    "crates/macmaid-core",
    "crates/macmaid-cli",
    "crates/macmaid-tui",
    "crates/macmaid-gui",
]

[workspace.package]
version = "0.15.36"
edition = "2021"
authors = ["DevOpen.io <contact@devopen.io>"]
license = "MIT"
homepage = "https://github.com/DevOpen-io/MacMaid"
repository = "https://github.com/DevOpen-io/MacMaid"

[workspace.dependencies]
macmaid-core = { path = "crates/macmaid-core" }
macmaid-tui = { path = "crates/macmaid-tui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4"] }
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
sysinfo = "0.32"
plist = "1.7"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.13"
