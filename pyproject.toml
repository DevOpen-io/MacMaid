[project]
name = "macmaid"
version = "0.14.3"
description = "Safe, fast macOS cleanup and system maintenance toolkit"
authors = [
    { name = "TalhaAksoy", email = "talha-_-0@hotmail.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "psutil>=7.0.0",
    "textual>=6.0,<8.0",
]

[project.scripts]
macmaid = "macmaid.cli:main"

[dependency-groups]
browser = [
    "playwright>=1.55,<2",
]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3.0",
    "ruff>=0.11,<1",
    "types-psutil>=7.0,<8",
]

[tool.ruff]
target-version = "py311"
lint.select = ["E4", "E7", "E9", "F"]
lint.ignore = ["E701", "E702"]  # Existing compact UI/CLI control-flow style.
exclude = [
    "src/macmaid/developer.py",
    "src/macmaid/features.py",
    "src/macmaid/i18n.py",
    "src/macmaid/review.py",
    "src/macmaid/safety.py",
    "src/macmaid/scanner.py",
    "src/macmaid/tui.py",
    "src/macmaid/web.py",
]

[tool.mypy]
python_version = "3.11"
files = ["src/macmaid/memory.py"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests_py"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"
