[project]
name = "deepclean"
version = "0.9.16"
description = "Safe, fast macOS cleanup and system maintenance toolkit"
authors = [
    { name = "TalhaAgteks", email = "talha.aksoy@agteks.com" }
]
requires-python = ">=3.11"
dependencies = [
    "psutil>=7.0.0",
    "textual>=6.0,<8.0",
]

[project.scripts]
deepclean = "deepclean.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"
