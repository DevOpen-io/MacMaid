[project]
name = "macmaid"
version = "0.11.3"
description = "Safe, fast macOS cleanup and system maintenance toolkit"
authors = [
    { name = "TalhaAgteks", email = "talha.aksoy@agteks.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "psutil>=7.0.0",
    "textual>=6.0,<8.0",
]

[project.scripts]
macmaid = "macmaid.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"
