name: Feature request
description: Suggest an idea or improvement for MacMaid
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        MacMaid's safety contract comes first: any feature that deletes,
        moves, or terminates must keep the review/confirmation gate.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where MacMaid falls short today.
      placeholder: "When I ..., I have to ... because MacMaid does not ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should MacMaid do? Which surface (CLI, TUI, Web UI, app)?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds you have tried.
    validations:
      required: false
