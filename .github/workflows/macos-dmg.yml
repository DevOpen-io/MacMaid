name: macOS DMG

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Compile Python
        run: uv run python -m compileall -q src/macmaid
      - name: Check Web UI JavaScript
        run: node --check src/macmaid/WebUI/app.js
      - name: Run tests
        run: uv run pytest -q

  build-dmg:
    name: Build DMG (arm64)
    needs: test
    runs-on: macos-14
    env:
      BUILD_ARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build app bundle
        run: |
          chmod +x scripts/build-macos-app.sh scripts/create-dmg.sh
          scripts/build-macos-app.sh

      - name: Build DMG
        run: |
          VERSION=$(uv run python - <<'PY'
          from macmaid import __version__
          print(__version__)
          PY
          )
          VERSION_TAG="v$VERSION"
          DMG="build/macos-app/MacMaid-$VERSION_TAG-$BUILD_ARCH.dmg"
          scripts/create-dmg.sh build/macos-app/MacMaid.app "$DMG"
          mkdir -p artifacts
          cp "$DMG" "$DMG.sha256" artifacts/
          ACTUAL_ARCH=$(uname -m)
          if [ "$ACTUAL_ARCH" != "$BUILD_ARCH" ]; then
            echo "Expected $BUILD_ARCH runner but got $ACTUAL_ARCH" >&2
            exit 1
          fi

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacMaid-dmg-arm64
          path: artifacts/*
          if-no-files-found: error

  release:
    name: GitHub Release from project version
    needs: build-dmg
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read project version
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import tomllib
          with open('pyproject.toml', 'rb') as handle:
              print(tomllib.load(handle)['project']['version'])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update release tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$TAG"

      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --title "MacMaid $VERSION" --latest
          else
            gh release create "$TAG" artifacts/* --title "MacMaid $VERSION" --generate-notes --latest
          fi

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: release
    if: needs.release.result == 'success'
    runs-on: ubuntu-latest
    env:
      TAP_REPOSITORY: DevOpen-io/homebrew-tap
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      VERSION: ${{ needs.release.outputs.version }}
      VERSION_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Stop if tap token is not configured
        if: env.TAP_TOKEN == ''
        run: |
          echo "HOMEBREW_TAP_TOKEN is not configured; skipping tap update."
          exit 0

      - name: Prepare tap checkout
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git" tap || true
          if [ ! -d tap/.git ]; then
            mkdir -p tap
            git -C tap init -b main
            git -C tap remote add origin "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git"
          fi
          git -C tap checkout main 2>/dev/null || git -C tap checkout -b main

      - name: Update Cask
        if: env.TAP_TOKEN != ''
        run: |
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$VERSION_TAG"
          ARM_DMG="MacMaid-$VERSION_TAG-arm64.dmg"
          curl -fsSL "$BASE_URL/$ARM_DMG" -o "$ARM_DMG"
          ARM_SHA=$(sha256sum "$ARM_DMG" | awk '{print $1}')
          mkdir -p tap/Casks
          cat > tap/Casks/macmaid.rb <<RUBY
          cask "macmaid" do
            version "$VERSION"
            sha256 "$ARM_SHA"

            url "$BASE_URL/$ARM_DMG"
            name "MacMaid"
            desc "Safe macOS cleanup, disk analysis and developer-tool maintenance"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            depends_on arch: :arm64

            app "MacMaid.app"
            binary "#{appdir}/MacMaid.app/Contents/MacOS/macmaid-bin", target: "macmaid"
          end
          RUBY

      - name: Commit and push tap update
        if: env.TAP_TOKEN != ''
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/macmaid.rb
          if git diff --cached --quiet; then
            echo "Tap is already up to date."
            exit 0
          fi
          git commit -m "Update MacMaid to $VERSION_TAG"
          git push origin HEAD:main
