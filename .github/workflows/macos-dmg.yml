name: macOS DMG

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-dmg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests & Verification
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rustfmt Check
        run: cargo fmt --all -- --check

      - name: Clippy Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Workspace Tests
        run: cargo test --workspace

  build-dmg:
    name: Build DMG (arm64)
    needs: test
    runs-on: macos-14
    env:
      BUILD_ARCH: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build App Bundle & CLI
        run: |
          chmod +x scripts/build-macos-app.sh scripts/create-dmg.sh
          ./scripts/build-macos-app.sh

      - name: Build DMG & CLI Archive
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          DMG="build/macos-app/MacMaid-$VERSION-$BUILD_ARCH.dmg"
          CLI_TARBALL="build/macos-app/MacMaid-$VERSION-$BUILD_ARCH-cli.tar.gz"
          ./scripts/create-dmg.sh build/macos-app/MacMaid.app "$DMG"
          mkdir -p artifacts
          tar -C build/macos-app/cli -czf "$CLI_TARBALL" macmaid
          shasum -a 256 "$CLI_TARBALL" | awk '{print $1}' > "$CLI_TARBALL.sha256"
          cp "$DMG" "$DMG.sha256" "$CLI_TARBALL" "$CLI_TARBALL.sha256" artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacMaid-dmg-arm64
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-dmg
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read project version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create immutable release tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          REMOTE_SHA=$(git ls-remote --refs origin "refs/tags/$TAG" | awk '{print $1}')
          if [ -n "$REMOTE_SHA" ]; then
            if [ "$REMOTE_SHA" != "$GITHUB_SHA" ]; then
              echo "Release tag $TAG already points to a different commit; bump the project version." >&2
              exit 1
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "MacMaid $TAG"
          git push origin "refs/tags/$TAG"

      - name: Download DMG artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate itemized release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          RANGE="${PREV_TAG:+$PREV_TAG..}$GITHUB_SHA"
          {
            echo "## What's Changed"
            echo
            git log --no-merges --format='%s' "$RANGE" | while IFS= read -r subject; do
              cleaned=$(printf '%s' "$subject" | sed -E \
                -e 's/^[a-zA-Z]+(\([^)]*\))?:[[:space:]]*//' \
                -e 's/^[Bb]ump version to [^ ]+ and //' \
                -e 's/^[Uu]pdate version to [^ ]+ and //')
              if [ -n "$cleaned" ]; then
                printf -- '- %s%s\n' "$(printf '%s' "${cleaned:0:1}" | tr '[:lower:]' '[:upper:]')" "${cleaned:1}"
              fi
            done
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV_TAG...$TAG"
            else
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/commits/$TAG"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "MacMaid $VERSION" --notes-file release-notes.md
          fi

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_REPOSITORY: DevOpen-io/homebrew-tap
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      VERSION: ${{ needs.release.outputs.version }}
      VERSION_TAG: ${{ needs.release.outputs.tag }}
    steps:
      - name: Update tap formulae
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPOSITORY}.git" tap
          BASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/$VERSION_TAG"
          ARM_DMG="MacMaid-$VERSION-arm64.dmg"
          ARM_CLI="MacMaid-$VERSION-arm64-cli.tar.gz"
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL "$BASE_URL/$ARM_DMG" -o "$ARM_DMG"
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL "$BASE_URL/$ARM_CLI" -o "$ARM_CLI"
          ARM_DMG_SHA=$(sha256sum "$ARM_DMG" | awk '{print $1}')
          ARM_CLI_SHA=$(sha256sum "$ARM_CLI" | awk '{print $1}')
          mkdir -p tap/Casks tap/Formula
          cat > tap/Casks/macmaid.rb <<RUBY
          cask "macmaid" do
            version "$VERSION"
            sha256 "$ARM_DMG_SHA"
            url "$BASE_URL/$ARM_DMG"
            name "MacMaid"
            desc "Safe macOS cleanup, disk analysis and developer-tool maintenance"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            depends_on arch: :arm64
            depends_on macos: ">= :ventura"
            app "MacMaid.app"
            zap trash: ["~/.config/macmaid", "~/Library/Logs/MacMaid"]
          end
          RUBY
          cat > tap/Formula/macmaid.rb <<RUBY
          class Macmaid < Formula
            version "$VERSION"
            sha256 "$ARM_CLI_SHA"
            url "$BASE_URL/$ARM_CLI"
            desc "Safe macOS cleanup, disk analysis and developer-tool maintenance"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            depends_on arch: :arm64
            depends_on macos: ">= :ventura"
            def install
              libexec.install Dir["*"]
              bin.install_symlink libexec/"macmaid"
            end
            test do
              assert_match version.to_s, shell_output("#{bin}/macmaid --version")
            end
          end
          RUBY
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Casks/macmaid.rb Formula/macmaid.rb
          git -C tap diff --cached --quiet || git -C tap commit -m "Update MacMaid to $VERSION_TAG"
          git -C tap push origin HEAD:main
