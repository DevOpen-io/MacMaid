name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Verify lockfile
        run: uv lock --check

      - name: Compile Python
        run: uv run python -m compileall -q src/macmaid

      - name: Check Web UI JavaScript
        run: node --check src/macmaid/WebUI/app.js

      - name: Run tests
        run: uv run pytest -q
