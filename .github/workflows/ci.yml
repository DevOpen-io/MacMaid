name: CI

on:
  push:
    branches: [main, feat/*]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  rust-check:
    name: Rust Quality Gate & Tests
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rustfmt Check
        run: cargo fmt --all -- --check

      - name: Clippy Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace Tests
        run: cargo test --workspace

  build-desktop-app:
    name: Native Desktop & CLI Build
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build macOS Application Bundle & CLI
        run: |
          chmod +x scripts/build-macos-app.sh scripts/create-dmg.sh
          ./scripts/build-macos-app.sh

      - name: Smoke Test CLI
        run: |
          ./build/macos-app/cli/macmaid --version
          ./build/macos-app/cli/macmaid doctor

      - name: Smoke Test Desktop App Executable
        run: |
          file build/macos-app/MacMaid.app/Contents/MacOS/MacMaid
          test -f build/macos-app/MacMaid.app/Contents/Info.plist
